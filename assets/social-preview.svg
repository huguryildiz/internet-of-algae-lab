<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Internet of Algae Lab</title>
  <desc id="desc">Interactive channel simulations for photosynthetic molecular networks.</desc>

  <defs>
    <linearGradient id="leftShade" x1="0" y1="320" x2="980" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020810"/>
      <stop offset="0.34" stop-color="#020810" stop-opacity="0.96"/>
      <stop offset="0.56" stop-color="#020810" stop-opacity="0.72"/>
      <stop offset="0.78" stop-color="#020810" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020810" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="640" y1="350" x2="640" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020810" stop-opacity="0"/>
      <stop offset="1" stop-color="#020810" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="accent" x1="74" y1="0" x2="1148" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3EF2A0"/>
      <stop offset="0.52" stop-color="#35E0D0"/>
      <stop offset="1" stop-color="#6EA8FF"/>
    </linearGradient>
    <linearGradient id="iconSignal" x1="8" y1="24" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3EF2A0"/>
      <stop offset="0.55" stop-color="#35E0D0"/>
      <stop offset="1" stop-color="#6EA8FF"/>
    </linearGradient>
    <linearGradient id="iconBorder" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3EF2A0" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#35E0D0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6EA8FF" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000814" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#020810"/>
  <image href="social-preview-background.png" x="0" y="0" width="1280" height="640" preserveAspectRatio="xMidYMid slice"/>
  <rect width="980" height="640" fill="url(#leftShade)"/>
  <rect width="1280" height="640" fill="url(#bottomShade)"/>

  <!-- Exact enlarged copy of assets/icon.svg -->
  <g transform="translate(74 62) scale(1.72)">
    <rect x="2.5" y="2.5" width="43" height="43" rx="12" fill="#020810" stroke="url(#iconBorder)" stroke-width="1.6"/>
    <circle cx="12" cy="24" r="4.6" stroke="url(#iconSignal)" stroke-width="2.4"/>
    <circle cx="20" cy="20.5" r="1.9" fill="#3EF2A0"/>
    <circle cx="24" cy="26.5" r="1.6" fill="#35E0D0"/>
    <circle cx="27.5" cy="21" r="1.3" fill="#35E0D0"/>
    <circle cx="30" cy="25.5" r="1.05" fill="#6EA8FF"/>
    <circle cx="37" cy="24" r="4.6" stroke="url(#iconSignal)" stroke-width="2.4"/>
    <circle cx="37" cy="24" r="7.6" stroke="#35E0D0" stroke-width="1" stroke-dasharray="2 2.6" opacity="0.55"/>
    <path d="M37 28.6C36 30.8 38.2 31.4 37.3 33.6" stroke="url(#iconSignal)" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <text x="176" y="93" fill="#C8D9E1" font-family="IBM Plex Mono, Menlo, monospace" font-size="15" font-weight="600" letter-spacing="2.6">INTERNET-OF-ALGAE-LAB</text>
  <text x="176" y="122" fill="#6F8B9A" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="1.5">INTERACTIVE RESEARCH EXPERIENCE</text>

  <g>
    <text x="74" y="254" fill="#F4F8FA" font-family="Georgia" font-size="70" font-weight="700" letter-spacing="-2">Internet of</text>
    <text x="74" y="326" fill="#F4F8FA" font-family="Georgia" font-size="70" font-weight="700" letter-spacing="-2">Algae Lab</text>
  </g>
  <rect x="76" y="354" width="92" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="74" y="408" fill="#D5E3E9" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500">Interactive channel simulations for</text>
  <text x="74" y="441" fill="#D5E3E9" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500">photosynthetic molecular networks</text>

  <g font-family="IBM Plex Mono, Menlo, monospace" font-size="13" font-weight="600" letter-spacing="0.8">
    <rect x="74" y="486" width="138" height="34" rx="17" fill="#071721" fill-opacity="0.88" stroke="#3EF2A0" stroke-opacity="0.42"/>
    <circle cx="94" cy="503" r="3.5" fill="#3EF2A0"/>
    <text x="106" y="508" fill="#B8CBD4">QUORUM SENSING</text>

    <rect x="224" y="486" width="112" height="34" rx="17" fill="#071721" fill-opacity="0.88" stroke="#35E0D0" stroke-opacity="0.42"/>
    <circle cx="244" cy="503" r="3.5" fill="#35E0D0"/>
    <text x="256" y="508" fill="#B8CBD4">VOC · AIR</text>

    <rect x="348" y="486" width="119" height="34" rx="17" fill="#071721" fill-opacity="0.88" stroke="#6EA8FF" stroke-opacity="0.42"/>
    <circle cx="368" cy="503" r="3.5" fill="#6EA8FF"/>
    <text x="380" y="508" fill="#B8CBD4">ELECTRICAL</text>

    <rect x="479" y="486" width="104" height="34" rx="17" fill="#071721" fill-opacity="0.88" stroke="#35E0D0" stroke-opacity="0.42"/>
    <circle cx="499" cy="503" r="3.5" fill="#35E0D0"/>
    <text x="511" y="508" fill="#B8CBD4">OPTICAL</text>
  </g>

  <text x="74" y="588" fill="#75909E" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="1.4">LIVE · BROWSER-BASED · STATIC</text>
  <text x="1204" y="588" text-anchor="end" fill="#75909E" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="1.4">IEEE TMBMC · 2026</text>
  <rect x="0" y="635" width="1280" height="5" fill="url(#accent)"/>
</svg>
