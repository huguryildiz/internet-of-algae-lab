<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Internet of Algae Lab">
  <defs>
    <linearGradient id="ioa-sig" x1="8" y1="24" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ef2a0"/><stop offset="0.55" stop-color="#35e0d0"/><stop offset="1" stop-color="#6ea8ff"/>
    </linearGradient>
    <linearGradient id="ioa-border" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ef2a0" stop-opacity="0.75"/><stop offset="0.5" stop-color="#35e0d0" stop-opacity="0.5"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect x="2.5" y="2.5" width="43" height="43" rx="12" fill="#020810" stroke="url(#ioa-border)" stroke-width="1.6"/>
  <!-- TX algae cell -->
  <circle cx="12" cy="24" r="4.6" stroke="url(#ioa-sig)" stroke-width="2.4"/>
  <!-- molecules diffusing across the channel -->
  <circle cx="20" cy="20.5" r="1.9" fill="#3ef2a0"/>
  <circle cx="24" cy="26.5" r="1.6" fill="#35e0d0"/>
  <circle cx="27.5" cy="21" r="1.3" fill="#35e0d0"/>
  <circle cx="30" cy="25.5" r="1.05" fill="#6ea8ff"/>
  <!-- RX cell with capture ring and flagellum -->
  <circle cx="37" cy="24" r="4.6" stroke="url(#ioa-sig)" stroke-width="2.4"/>
  <circle cx="37" cy="24" r="7.6" stroke="#35e0d0" stroke-width="1" stroke-dasharray="2 2.6" opacity="0.55"/>
  <path d="M37 28.6 C 36 30.8, 38.2 31.4, 37.3 33.6" stroke="url(#ioa-sig)" stroke-width="1.6" stroke-linecap="round"/>
</svg>
